<!DOCTYPE html>
<html>
<body>
<h1>HTML5 Canvas textBaseline</h1>

<canvas id="myCanvas" width="500" height="150" style="border:1px solid grey;">
Sorry, your browser does not support canvas.
</canvas>

<script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

// Create a line
ctx.strokeStyle = "black";
ctx.lineWidth  = 2;
ctx.beginPath();
ctx.moveTo(0,75);
ctx.lineTo(500,75);
ctx.stroke();
ctx.closePath();

ctx.font = "20px Arial";
ctx.fillStyle = "purple";

ctx.textBaseline = "top";
ctx.fillText("top", 5, 75);

ctx.textBaseline = "hanging";
ctx.fillText("hanging", 40, 75);

ctx.textBaseline = "middle";
ctx.fillText("middle", 120, 75);

ctx.textBaseline = "alphabetic";
ctx.fillText("alphabetic", 190, 75);

ctx.textBaseline = "ideographic";
ctx.fillText("ideographic", 295, 75);

ctx.textBaseline = "bottom";
ctx.fillText("bottom", 410, 75);
</script>

<h1>HTML5 Canvas textAlign</h1>

<canvas id="myCanvas2" width="500" height="150" style="border:1px solid grey;">
Sorry, your browser does not support canvas.
</canvas>

<script>
const canvas2 = document.getElementById("myCanvas2");
const ctx2 = canvas2.getContext("2d");

// Create a line
ctx2.strokeStyle = "black";
ctx2.lineWidth  = 2;
ctx2.beginPath();
ctx2.moveTo(250,0);
ctx2.lineTo(250,250);
ctx2.stroke();
ctx2.closePath();

ctx2.font = "20px Arial";
ctx2.fillStyle = "purple";

ctx2.textAlign = "center";
ctx2.fillText("center", 250, 20);

ctx2.textAlign = "start";
ctx2.fillText("start", 250, 50);

ctx2.textAlign = "end";
ctx2.fillText("end", 250, 80);

ctx2.textAlign = "left";
ctx2.fillText("left", 250, 110);

ctx2.textAlign = "right";
ctx2.fillText("right", 250, 135);
</script>

<h1>HTML5 Canvas Center Text</h1>

<canvas id="myCanvas3" width="300" height="150" style="border:1px solid grey;">
Sorry, your browser does not support canvas.
</canvas>

<script>
const canvas3 = document.getElementById("myCanvas3");
const ctx3=canvas3.getContext("2d");

ctx3.font="30px Verdana";
ctx3.fillStyle = "red";
ctx3.textAlign = "center";
ctx3.textBaseline = "middle";
ctx3.fillText("Hello World", canvas3.width/2, canvas3.height/2);
</script>
</body>
</html>
