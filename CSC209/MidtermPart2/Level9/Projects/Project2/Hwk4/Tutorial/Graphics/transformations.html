<!DOCTYPE html>
<html>
<body>

<h1>HTML5 Canvas translate()</h1>

<canvas id="myCanvas" width="300" height="150" style="border:1px solid grey">
Sorry, your browser does not support canvas.
</canvas>

<script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

ctx.fillStyle = "red";
ctx.fillRect(10, 10, 100, 50);

ctx.translate(70, 70);

ctx.fillStyle = "blue";
ctx.fillRect(10, 10, 100, 50);

ctx.translate(80, -65);

ctx.fillStyle = "yellow";
ctx.fillRect(10, 10, 100, 50);
</script>
<h1>HTML5 Canvas rotate()</h1>

<canvas id="myCanvas2" width="300" height="150" style="border:1px solid grey">
Sorry, your browser does not support canvas.
</canvas>

<script>
const canvas2 = document.getElementById("myCanvas2");
const ctx2 = canvas2.getContext("2d");

ctx2.rotate((Math.PI/180)*20);

ctx2.fillStyle = "red";
ctx2.fillRect(50, 10, 100, 50);

ctx2.strokeStyle = "blue";
ctx2.strokeRect(70, 30, 100, 50);
</script>
<h1>HTML5 Canvas transform()</h1>

<canvas id="myCanvas3" width="300" height="300" style="border:1px solid grey">
Sorry, your browser does not support canvas.
</canvas>

<script>
const canvas3 = document.getElementById("myCanvas3");
const ctx3 = canvas3.getContext("2d");

ctx3.fillStyle = "yellow";
ctx3.fillRect(10, 10, 200, 100)

ctx3.transform(1, 0.5, -0.5, 1, 30, 10);

ctx3.fillStyle = "red";
ctx3.fillRect(10, 10, 200, 100);

ctx3.transform(1, 0.5, -0.5, 1, 30, 10);

ctx3.fillStyle = "blue";
ctx3.fillRect(10, 10, 200, 100);
</script>
</body>
</html>
