<!DOCTYPE html>
<html>
<body>
<h1>HTML5 Canvas quadraticCurveTo() Method</h1>

<canvas id="myCanvas" width="300" height="150" style="border:1px solid #000000;">
Sorry, your browser does not support canvas.
</canvas>

<script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

ctx.beginPath();
ctx.moveTo(10, 100);
ctx.quadraticCurveTo(250, 170, 230, 20);
ctx.stroke();
</script>
<h1>HTML5 Canvas bezierCurveTo() Method</h1>

<canvas id="myCanvas2" width="300" height="170" style="border:1px solid #000000;">
Sorry, your browser does not support canvas.
</canvas>

<script>
const canvas2 = document.getElementById("myCanvas2");
const ctx2 = canvas2.getContext("2d");

ctx2.beginPath();
ctx2.moveTo(20, 20);
ctx2.bezierCurveTo(110, 150, 180, 10, 210, 140);
ctx2.stroke();
</script>
</body>
</html>
